<div class="container">
    <div class="left-panel">
        <h2 class="section-title">{{ text.themesTitle }}</h2>
        <div class="treemap-shell" *ngIf="themes && themes.length">
            <div class="treemap-a11y-controls" role="group" [attr.aria-label]="text.themeSelectorLabel">
                <button
                    *ngFor="let theme of themes"
                    type="button"
                    class="treemap-a11y-button"
                    [attr.aria-pressed]="activeThemeId === theme.id"
                    (click)="setActiveTheme(theme.id)"
                >
                    {{ theme.label }} – {{ theme.value }} {{ text.voicesRaisedSuffix }}
                </button>
            </div>
            <canvas #treemapCanvas aria-hidden="true"></canvas>
            <div
                class="treemap-tooltip"
                *ngIf="hoveredThemeTooltip"
                [style.left.px]="hoveredThemeTooltip.left"
                [style.top.px]="hoveredThemeTooltip.top"
            >
                <strong>{{ hoveredThemeTooltip.label }}</strong>
                <span>{{ hoveredThemeTooltip.voicesText }}</span>
            </div>
        </div>
    </div>

    <div class="right-panel">
        <h2 class="section-title">{{ text.voicesTitle }}</h2>
        <div class="voices-grid" [@voicesAnimation]="displayedVoices.length">
            <div *ngFor="let voice of displayedVoices" class="voice-card active" [ngClass]="voice.color" [style.background-color]="voice.activeBackgroundColor || voice.backgroundColor">
                <img [src]="text.quoteIconSrc" [alt]="text.quoteIconAlt" class="quote-icon">
                <div class="quote-container">
                    <p class="quote-text">{{ voice.description }}</p>
                    <p class="quote-author">– {{ voice.voice_by }},{{voice.state | titlecase}}</p>
                </div>
            </div>
        </div>
    </div>
</div>
