<div
  class="program-card-carousel"
  [class.has-nav-prev]="canShowPreviousArrow"
  [class.has-nav-next]="canShowNextArrow"
  [class.has-cards]="cards.length > 0"
  *ngIf="cards.length || previousLayerColor || nextLayerColor"
>

  <button
    type="button"
    class="program-card-nav program-card-nav-prev"
    [attr.aria-label]="canGoToPrevious ? prevLabel : 'Previous ' + previousLayerLabel"
    *ngIf="canShowPreviousArrow"
    [class.layer-nav-arrow]="!canGoToPrevious"
    [style.--arrow-color]="previousArrowColor"
    (click)="showPrevious()"
  >
    <svg viewBox="0 0 46 46" aria-hidden="true">
      <circle class="arrow-outer-ring" cx="23" cy="23" r="21" />
      <circle class="arrow-inner-ring" cx="23" cy="23" r="17" />
      <path class="arrow-chevron" d="M27 14 18 23l9 9" />
      <path class="arrow-rays" d="M-4 9v8M-17 13l7 3.87M-17 33l7-3.87M-4 29v8" />
    </svg>
  </button>


  <div class="program-card-content" *ngIf="cards.length">

    <div
      class="program-mode-cards"
      [class.partner-grid]="isPartnerVariant"
    >

      <article
        class="program-mode-card"
        *ngFor="
          let card of visibleCards;
          let cardIndex = index;
          trackBy: trackByIndex
        "
        [class.partner-card]="isPartnerVariant"
      >

        <ng-container
          *ngIf="getCardLabel(card, cardIndex) as cardLabel"
        >

        <ng-container
          *ngIf="
            isPartnerVariant;
            else outcomeProgramCard
          "
        >

          <img
            [src]="getCardImage(card)"
            [alt]="card.alt || cardLabel"
            class="program-partner-card-image"
          />

          <h4
          class="program-partner-card-title">
            {{ cardLabel }}
          </h4>

          <a
            *ngIf="getCardLink(card)"
            [href]="getCardLink(card)"
            target="_blank"
            rel="noopener noreferrer"
            class="program-partner-card-link"
          >
            {{ card.ctaLabel || defaultCtaLabel }} →
          </a>

        </ng-container>


        <ng-template #outcomeProgramCard>

          <span
            class="program-mode-tag"
            [class.has-tooltip]="isLabelTruncated(cardLabel)"
            (mouseenter)="isLabelTruncated(cardLabel) && showTooltip($event, cardLabel)"
            (mouseleave)="hideTooltip()"
            (click)="isLabelTruncated(cardLabel) && toggleTooltipMobile($event, cardLabel)"
          >
            {{ cardLabel | sentenceCase }}
          </span>

          <p>
            {{ getCardDescription(card) }}
          </p>

        </ng-template>

        </ng-container>

      </article>

    </div>


    <div
      class="program-card-indicators"
      *ngIf="canShowControls"
      [attr.aria-label]="cardPagesLabel"
    >

      <button
        *ngFor="
          let page of pages;
          let idx = index
        "
        type="button"
        class="program-card-indicator"
        [class.active]="
          idx === pageIndex
        "
        [attr.aria-label]="
          'Go to page ' + (idx + 1)
        "
        (click)="goToPage(idx)"
      >
      </button>

    </div>

  </div>


  <button
    type="button"
    class="program-card-nav program-card-nav-next"
    [attr.aria-label]="canGoToNext ? nextLabel : 'Next ' + nextLayerLabel"
    *ngIf="canShowNextArrow"
    [class.layer-nav-arrow]="!canGoToNext"
    [style.--arrow-color]="nextArrowColor"
    (click)="showNext()"
  >
    <svg viewBox="0 0 46 46" aria-hidden="true">
      <circle class="arrow-outer-ring" cx="23" cy="23" r="21" />
      <circle class="arrow-inner-ring" cx="23" cy="23" r="17" />
      <path class="arrow-chevron" d="m19 14 9 9-9 9" />
      <path class="arrow-rays" d="M50 9v8M63 13l-7 3.87M63 33l-7-3.87M50 29v8" />
    </svg>
  </button>

</div>

<div
  class="global-tooltip"
  *ngIf="tooltipVisible"
  [style.top.px]="tooltipTop"
  [style.left.px]="tooltipLeft"
>
  {{ tooltipText | sentenceCase }}
</div>
